[project]
name = "model-console"
version = "0.1.0"
description = "Server-centered TUI runtime for provider-backed AI sessions."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/mcon/src/mcon",
    "packages/audit/src/audit",
    "packages/auth/src/auth",
    "packages/cli/src/cli",
    "packages/config/src/config",
    "packages/doctor/src/doctor",
    "packages/middleware/src/middleware",
    "packages/runtime/src/runtime",
    "packages/server/src/server",
    "packages/system/src/system",
    "packages/tui/src/tui",
    "packages/adapter/src/adapter",
]
